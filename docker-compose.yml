# Deploy: docker compose --env-file .env up -d --build
services:
  trmnl-football-api:
    build: .
    image: trmnl-football-api:latest
    container_name: trmnl-football-api
    restart: unless-stopped
    ports:
      - "3458:3458"
    environment:
      FOOTBALL_DATA_TOKEN: ${FOOTBALL_DATA_TOKEN}
      TEAM_ID: ${TEAM_ID:-64}
      TEAM_NAME: ${TEAM_NAME:-Liverpool}
      OWNED_CHANNELS: ${OWNED_CHANNELS:-sky,tnt,bbc,itv,channel4,channel5,s4c}
      ENABLE_BROADCAST: ${ENABLE_BROADCAST:-0}
      CONTACT: ${CONTACT:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://192.168.68.111:3458}
      FIXTURES_SOURCE: ${FIXTURES_SOURCE:-api}
    volumes:
      - ./cache:/app/cache
