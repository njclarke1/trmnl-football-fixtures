<meta charset="utf-8"><body style="background:#3a3a3a;display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px">
<style>
  .fx *{box-sizing:border-box;margin:0;padding:0}
  .fx{
    width:960px;height:540px;background:#fff;color:#000;
    display:flex;flex-direction:column;overflow:hidden;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-kerning:none;
  }
  .fx .bar{background:#000;color:#fff;height:58px;display:flex;align-items:center;
    justify-content:space-between;padding:0 22px;flex:0 0 58px}
  .fx .comp{display:flex;align-items:baseline;min-width:0}
  .fx .comp-name{font-size:25px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
  .fx .comp-round{margin-left:14px;font-size:14px;letter-spacing:.2em;text-transform:uppercase;opacity:.8;white-space:nowrap}
  .fx .venue-tag{font-size:14px;letter-spacing:.2em;text-transform:uppercase;
    border:2px solid #fff;padding:4px 11px;flex:0 0 auto}
  .fx .main{flex:1 1 auto;display:flex;min-height:0}
  .fx .fixture{flex:1 1 auto;padding:22px 24px;display:flex;flex-direction:column;
    justify-content:center;min-width:0}
  .fx .side{display:flex;align-items:center;min-width:0}
  .fx .crest{width:86px;height:86px;flex:0 0 86px;border:3px solid #000;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;overflow:hidden}
  .fx .crest img{width:78px;height:78px}
  .fx .crest.inv{background:#000;color:#fff}
  .fx .club{margin-left:20px;font-size:42px;font-weight:700;line-height:1.02;letter-spacing:-.015em;
    text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fx .club.long{font-size:32px}
  .fx .vee{display:flex;align-items:center;padding-left:32px;margin:12px 0}
  .fx .vee-rule{height:2px;background:#000;flex:1 1 auto;margin-left:14px}
  .fx .vee-mark{font-size:16px;letter-spacing:.3em;text-transform:uppercase;font-weight:700}
  .fx .kick{flex:0 0 292px;border-left:2px solid #000;padding:20px 22px;
    display:flex;flex-direction:column;justify-content:center}
  .fx .kick-day{font-size:18px;letter-spacing:.26em;text-transform:uppercase;font-weight:700}
  .fx .kick-date{margin-top:4px;font-size:60px;font-weight:700;line-height:.94;letter-spacing:-.03em}
  .fx .kick-time{font-size:50px;font-weight:700;line-height:1;letter-spacing:-.02em;margin-top:4px}
  .fx .kick-meta{margin-top:12px;padding-top:10px;border-top:2px solid #000;font-size:15px;line-height:1.4}
  .fx .kick-meta strong{display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
  .fx .countdown{display:inline-block;margin-top:10px;padding:4px 10px;font-size:14px;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;background:#000;color:#fff}
  .fx .tv{flex:0 0 58px;border-top:3px solid #000;display:flex;align-items:stretch}
  .fx .tv-label{flex:0 0 92px;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    border-right:2px solid #000;text-align:center;line-height:1.2}
  .fx .tv-body{flex:1 1 auto;min-width:0;display:flex;align-items:center;padding:0 18px}
  .fx .tv-primary{background:#000;color:#fff;font-size:20px;font-weight:700;
    letter-spacing:.02em;padding:6px 12px;white-space:nowrap;flex:0 0 auto}
  .fx .tv-also{margin-left:12px;font-size:15px;line-height:1.25;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .fx .tv-also span{white-space:nowrap}
  .fx .tv-status{flex:0 0 auto;border-left:2px solid #000;padding:0 18px;
    display:flex;align-items:center;font-size:13px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;align-self:stretch}
  .fx .tv-note{flex:1 1 auto;display:flex;align-items:center;padding:0 18px;
    font-size:17px;font-weight:700;letter-spacing:.04em}
  .fx .tv-note em{font-style:normal;font-weight:400;letter-spacing:0;margin-left:10px;font-size:15px}
  .fx .rail{flex:0 0 88px;border-top:2px solid #000;display:flex;align-items:stretch}
  .fx .rail-label{flex:0 0 92px;display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    border-right:2px solid #000;line-height:1.2}
  .fx .rail-item{flex:1 1 0;min-width:0;padding:10px 14px;display:flex;flex-direction:column;
    justify-content:center;border-right:2px solid #000}
  .fx .rail-item.wide{flex:1 1 100%}
  .fx .rail-item:last-child{border-right:0}
  .fx .rail-when{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
  .fx .rail-opp{margin-top:2px;font-size:20px;font-weight:700;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fx .rail-comp{margin-top:2px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fx .chip{display:inline-block;padding:1px 5px;background:#000;color:#fff;
    font-size:10px;font-weight:700;letter-spacing:.12em;vertical-align:2px}
  .fx .chip.out{background:#fff;color:#000;border:1.5px solid #000;padding:0 4px}
  .fx .empty{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:0 60px}
  .fx .empty-head{margin-top:14px;font-size:38px;font-weight:700;text-transform:uppercase}
  .fx .empty-sub{margin-top:14px;font-size:18px;line-height:1.5;max-width:560px}
  .fx .crest.big{width:116px;height:116px;flex:0 0 116px;font-size:36px}
</style>

<div class="fx">

  <div class="bar">
    <div class="comp"><span class="comp-name">Liverpool</span><span class="comp-round">Fixtures</span></div>
    <span class="venue-tag">Idle</span>
  </div>
  <div class="empty">
    <div class="crest inv big">LIV</div>
    <div class="empty-head">No fixtures scheduled</div>
    <div class="empty-sub">The next round hasn't been drawn yet. This screen updates as soon as a date is confirmed.</div>
  </div>
  <div class="rail">
    <div class="rail-label">Data</div>
    <div class="rail-item wide">
      <div class="rail-when">Refreshed 11 Aug, 09:14</div>
      <div class="rail-comp">Fixtures: stub · Broadcast: uk-listings</div>
    </div>
  </div>

</div>
</body>
